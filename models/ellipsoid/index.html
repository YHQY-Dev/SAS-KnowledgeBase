      <h1>椭球</h1>
      <p class="subtitle-en">Ellipsoid form factors</p>

      <p>椭球类用两个或三个半轴描述略扁或略长的旋转体与三轴体，是球与极端棒/盘之间的连续过渡。取向平均后，$I(q)$ 振荡被平滑，但仍由特征半轴尺度决定拐折位置。</p>
      <p class="muted">模型条目将按手册页陆续列出；下列卡片链到各模型页。</p>

      <h2>模型条目</h2>

        <a class="card" href="triaxial-ellipsoid.html">

          triaxial ellipsoid — 三个不等半轴的均匀椭球
