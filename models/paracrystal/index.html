      <h1>准晶</h1>
      <p class="subtitle-en">Paracrystal structures</p>

      <p>准晶（paracrystal）模型描述具有近程有序、远程逐渐失序的点阵：在 $I(q)$ 上表现为展宽的布拉格峰与衰减的高阶峰。本类给出简单立方、体心立方与面心立方三种常见格子。</p>
      <p class="muted">下列卡片进入各模型手册页。</p>

      <h2>模型条目</h2>
      <div class="card-grid">

        </a>

          BCC paracrystal — BCC 点阵准晶结构
